name: com.powerbox.app
description: A new Flutter project.

version: 1.0.15+27

#x.y.z - 版本号（显示给用户）
#n - 构建号（内部版本）

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.15  # 用于本地数据存储
  table_calendar: ^3.1.8  # 用于日历组件
  syncfusion_flutter_charts: ^28.2.5+1  # 用于 Echarts 柱状图
  intl: ^0.20.0
  path_provider: ^2.1.1  # 用于文件路径获取
  file_picker: ^8.1.4  # 使用更新的兼容版本，支持 v2 embedding
  http: ^1.1.0  # 用于网络请求检查更新
  open_file: ^3.3.2  # 用于打开APK文件安装
  package_info_plus: ^8.0.0  # 用于获取App版本信息
  encrypt: ^5.0.3  # 用于密码加密存储
  local_auth: ^2.3.0  # 用于本地生物识别/密码认证

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true